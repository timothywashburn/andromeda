- name: configure opnsense after wireguard tunnel install
  hosts: gateway_vm
  vars:
    ansible_host: "{{ hostvars[groups.gateway_node | first].wan_ip }}"
    peer: "{{ hostvars[groups.public_relay | first] }}"
    api_delegate: "{{ groups.gateway_node | first }}"
    port_aliases: "{{ lookup('ansible.builtin.template', 'port_aliases.yml.j2') | from_yaml | default([], true) }}"
    service_rules: "{{ lookup('ansible.builtin.template', 'service_rules.yml.j2') | from_yaml | default([], true) }}"
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ hostvars[inventory_hostname].ansible_host }}"
      api_key: "{{ opnsense_api_key }}"
      api_secret: "{{ opnsense_api_secret }}"
      ssl_verify: false
  tasks:
    - name: lockout guard # ai assisted here lol
      vars:
        reserved_ports: "{{ [hostvars[groups.public_relay | first].ansible_port, hostvars[groups.public_relay | first].tunnel_port] }}"
        claimed_port_ranges: "{{ services | map(attribute='ports') | map('string') | map('replace', ' ', '') | map('split', ',') | flatten | map('split', '-') | list }}"
      ansible.builtin.assert:
        that:
          - item.0 | int < (item.1 | first | int) or item.0 | int > (item.1 | last | int)
        fail_msg: "port {{ item.0 }}  '{{ item.1 | join('-') }}'"
        quiet: true
      loop: "{{ reserved_ports | product(claimed_port_ranges) | list }}"
      loop_control:
        label: "{{ item.0 }} vs {{ item.1 | join('-') }}"

    - name: ensure port remapping is valid
      ansible.builtin.assert:
        that:
          - "',' not in (item.ports | string)"
          - "'-' not in (item.ports | string)"
        fail_msg: "service {{ item.name }} contains a destination port and multiple source ports"
      loop: "{{ services | selectattr('dest_port', 'defined') | list }}"

    - name: create port aliases
      oxlorg.opnsense.alias_multi:
        aliases: "{{ port_aliases }}"
      notify: apply firewall aliases
        
    - name: manage tunnel firewall rules
      oxlorg.opnsense.rule_multi:
        match_fields:
          - description
        rules: "{{ static_rules + service_rules }}"
        multi_control:
          override:
            action: pass
            direction: in
          purge_unconfigured: true
      notify: apply firewall rules
      
    - name: purge unused aliases
      oxlorg.opnsense.alias_multi:
        aliases: "{{ port_aliases }}"
        multi_control:
          purge_unconfigured: true
      notify: apply firewall aliases
  
  handlers:
    - name: apply firewall aliases
      oxlorg.opnsense.raw:
        module: firewall
        controller: alias
        command: reconfigure
        action: post

    - name: apply firewall rules
      oxlorg.opnsense.raw:
        module: firewall
        controller: filter
        command: apply
        action: post

- name: forward public relay traffic
  hosts: public_relay
  tasks:
    - name: set up ip forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-ip-forwarding.conf
        content: "net.ipv4.ip_forward = 1\n"
        mode: "644"
      register: sysctl_conf
    
    - name: apply sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl_conf.changed # noqa: no-handler
      changed_when: true
    
    - name: install iptables-persistent
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true
    
    - name: create iptable rules
      ansible.builtin.template:
        src: rules.v4.j2
        dest: /etc/iptables/rules.v4
        mode: "600"
        validate: iptables-restore --test %s
      notify: reload iptables

  handlers:
    - name: reload iptables
      ansible.builtin.command: iptables-restore /etc/iptables/rules.v4
      changed_when: true

- name: switch proxmox gateway
  hosts: gateway_node
  vars:
    ansible_host: "{{ wan_ip }}"
  tasks:
    - name: copy new interfaces configuration
      ansible.builtin.template:
        src: interfaces.j2
        dest: /etc/network/interfaces
      vars:
        gateway: lan
      notify: update interface
      
  handlers:
    - name: update interface
      ansible.builtin.command: ifreload -a
      changed_when: true

