- name: change relay ssh port
  hosts: public_relay
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: 04_ssh_public_relay

- name: gateway vm wireguard instance intial setup
  hosts: gateway_vm
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}" 
  tasks:
    - ansible.builtin.import_role:
        name: 05_gateway_vm_wireguard_pt1
  
- name: public relay wireguard setup
  hosts: public_relay
  vars:
    peer: "{{ hostvars[groups.gateway_vm | first] }}"
  tasks:
    - ansible.builtin.import_role:
        name: 06_public_relay_wireguard

- name: gateway vm wireguard instance final setup
  hosts: gateway_vm
  vars:
    ansible_host: "{{ hostvars[groups.gateway_node | first].wan_ip }}"
    peer: "{{ hostvars[groups.public_relay | first] }}"
    api_delegate: "{{ groups.gateway_node | first }}"
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}"
  tasks:
    - ansible.builtin.import_role:
        name: 07_gateway_vm_wireguard_pt2

- name: configure opnsense after wireguard tunnel install
  hosts: gateway_vm
  vars:
    ansible_host: "{{ hostvars[groups.gateway_node | first].wan_ip }}"
    peer: "{{ hostvars[groups.public_relay | first] }}"
    api_delegate: "{{ groups.gateway_node | first }}"
    port_aliases: "{{ lookup('ansible.builtin.template', 'port_aliases.yml.j2') | from_yaml | default([], true) }}"
    service_rules: "{{ lookup('ansible.builtin.template', 'service_rules.yml.j2') | from_yaml | default([], true) }}"
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}"
  tasks:
    - ansible.builtin.import_role:
        name: 08_configure_opnsense

- name: forward public relay traffic
  hosts: public_relay
  tasks:
    - ansible.builtin.import_role:
        name: 09_forward_relay_traffic

- name: switch proxmox gateway
  hosts: gateway_node
  vars:
    ansible_host: "{{ wan_ip }}"
  tasks:
    - name: switch gateway to lan
      ansible.builtin.template:
        src: interfaces.j2
        dest: /etc/network/interfaces
        mode: "644"
      vars:
        gateway: lan
      notify: update interface
    
    - name: register gateway switch to vm
      ansible.builtin.copy:
        content: ""
        dest: /andromeda/markers/lan-gateway
        mode: "644"
      
  handlers:
    - name: update interface
      ansible.builtin.command: ifreload -a
      changed_when: true

- name: prepare debian cloud image
  hosts: gateway_node
  vars:
    ansible_host: "{{ wan_ip }}"
  tasks:
    - name: download debian cloud image
      ansible.builtin.get_url:
        url: "{{ debian_cloud_image.base_url }}/{{ debian_cloud_image.file }}"
        dest: "/var/lib/vz/import/{{ debian_cloud_image.file }}"
        checksum: "sha512:{{ debian_cloud_image.base_url }}/SHA512SUMS"
        mode: "644"

- name: provision debian cloud vms
  hosts: generic_deb_vms
  gather_facts: false
  vars:
    proxmox_node: "{{ groups.gateway_node | first }}"
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_module_defaults }}"
  tasks:
    - ansible.builtin.import_tasks: tasks/proxmox/fetch_ca.yml
    
    - ansible.builtin.import_role:
        name: 10_provision_debian_vms

- name: setup netbird management and client
  hosts: netbird_vm
  vars:
    netbird_all_group_id: "{{ (netbird_groups.data | selectattr('name', 'eq', 'All') | first).id }}"
    netbird_router_peer_id: "{{ (netbird_peers.data | selectattr('hostname', 'eq', inventory_hostname | replace('_', '-')) | first).id }}"
  module_defaults:
    group/community.ansible_netbird.netbird:
      api_url: "https://{{ netbird_domain }}"
      api_token: "{{ netbird_pat }}"
  tasks:
    - ansible.builtin.import_role:
        name: 20_netbird_vm

- name: setup reverse proxy
  hosts: rev_proxy_vm
  tasks:
    - ansible.builtin.import_role:
        name: 21_caddy_rev_proxy
