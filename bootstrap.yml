- name: prepare debian cloud image
  hosts: gateway_node
  vars:
    ansible_host: "{{ wan_ip }}"
  tasks:
    - name: download debian cloud image
      ansible.builtin.get_url:
        url: "{{ debian_cloud_image.base_url }}/{{ debian_cloud_image.file }}"
        dest: "/var/lib/vz/import/{{ debian_cloud_image.file }}"
        checksum: "sha512:{{ debian_cloud_image.base_url }}/SHA512SUMS"
        mode: "644"

- name: provision debian cloud vms
  hosts: generic_deb_vms
  gather_facts: false
  vars:
    proxmox_node: "{{ groups.gateway_node | first }}"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ hostvars[proxmox_node].wan_ip }}"
      api_user: root@pam
      api_password: "{{ proxmox_password }}"
      validate_certs: false
  tasks:
    - name: create vm
      community.proxmox.proxmox_kvm:
        name: "{{ inventory_hostname | replace('_', '-') }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ vm_id }}"
        bios: seabios
        onboot: true
        cpu: host
        cores: "{{ vm_cores }}"
        memory: "{{ vm_memory_mb }}"
        scsihw: virtio-scsi-single
        boot: "order=scsi0"
        agent: true
        citype: nocloud
        ciuser: root
        cipassword: "{{ temp_password }}" # TODO: temp
        sshkeys: "{{ public_ssh_keys | join('\n') }}"
        nameservers: "10.127.0.254"
        ipconfig:
          ipconfig0: "ip={{ ansible_host }}/24,gw=10.127.0.254"
        ide:
          ide2: "local-lvm:cloudinit"
        net:
          net0: "virtio,bridge=vmbr1,firewall=0"
        serial:
          serial0: socket
      delegate_to: localhost

    - name: import cloud image as boot disk
      community.proxmox.proxmox_disk:
        vmid: "{{ vm_id }}"
        disk: scsi0
        storage: local-lvm
        import_from: "local:import/{{ debian_cloud_image.file }}"
      delegate_to: localhost
      register: disk_import

    - name: grow cloud image boot disk
      community.proxmox.proxmox_disk:
        vmid: "{{ vm_id }}"
        disk: scsi0
        state: resized
        size: "{{ vm_storage_gb }}G"
      delegate_to: localhost
      when: disk_import.changed # noqa: no-handler

    - name: start vm
      community.proxmox.proxmox_kvm:
        vmid: "{{ vm_id }}"
        node: "{{ proxmox_node }}"
        state: started
      delegate_to: localhost
    
    - name: wait for ssh
      ansible.builtin.wait_for_connection:
        timeout: 60

- name: setup netbird management and client
  hosts: netbird_vm
  vars:
    netbird_all_group_id: "{{ (netbird_groups.data | selectattr('name', 'eq', 'All') | first).id }}"
    netbird_router_peer_id: "{{ (netbird_peers.data | selectattr('hostname', 'eq', inventory_hostname | replace('_', '-')) | first).id }}"
  module_defaults:
    group/community.ansible_netbird.netbird:
      api_url: "https://{{ netbird_domain }}"
      api_token: "{{ netbird_pat }}"
  tasks:
    - name: add docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_distribution_release }}"
        components: stable
        signed_by: https://download.docker.com/linux/debian/gpg

    - name: install packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
    - name: enable qemu guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
    
    - name: create netbird directory
      ansible.builtin.file:
        path: /etc/netbird
        state: directory
        mode: "755"

    - name: write netbird compose file
      ansible.builtin.template:
        src: netbird-compose.yml.j2
        dest: /etc/netbird/docker-compose.yml
        mode: "600"
      notify: restart netbird

    - name: write netbird server config
      ansible.builtin.template:
        src: netbird-config.yaml.j2
        dest: /etc/netbird/config.yaml
        mode: "600"
      diff: false
      notify: restart netbird

    - name: write netbird dashboard env
      ansible.builtin.template:
        src: netbird-dashboard.env.j2
        dest: /etc/netbird/dashboard.env
        mode: "600"
      notify: restart netbird

    - name: start netbird
      community.docker.docker_compose_v2:
        project_src: /etc/netbird
        state: present
    
    - name: flush handlers
      ansible.builtin.meta: flush_handlers

    - name: wait for netbird server
      ansible.builtin.uri:
        url: "https://{{ netbird_domain }}/oauth2/.well-known/openid-configuration"
        method: GET
        status_code: [200, 502, 503]
      register: netbird_ready
      until: netbird_ready.status == 200
      retries: 10
      delay: 2
    
    - name: create netbird admin account
      ansible.builtin.uri:
        url: "https://{{ netbird_domain }}/api/setup"
        method: POST
        body_format: json
        body:
          email: "{{ netbird_admin_email }}"
          name: "{{ netbird_admin_name }}"
          password: "{{ netbird_admin_password }}"
          create_pat: true
          pat_expire_in: 365
      register: netbird_admin_account
      when: netbird_pat is not defined
      no_log: true

    - name: save netbird personal access token
      ansible.builtin.copy:
        content: |
          # written by Ansible ({{ '%Y-%m-%d' | strftime }})
          netbird_pat: "{{ netbird_admin_account.json.personal_access_token }}"
        dest: "{{ inventory_dir }}/group_vars/all/netbird_pat.yml"
        mode: "600"
      delegate_to: localhost
      when: netbird_admin_account is not skipped
      no_log: true
      diff: false

    - name: load netbird personal access token
      ansible.builtin.set_fact:
        netbird_pat: "{{ netbird_admin_account.json.personal_access_token }}"
      no_log: true
      when: netbird_admin_account is not skipped
    
    # client setup

    - name: add netbird repository
      ansible.builtin.deb822_repository:
        name: netbird
        types: deb
        uris: https://pkgs.netbird.io/debian
        suites: stable
        components: main
        signed_by: https://pkgs.netbird.io/debian/public.key
      
    - name: install netbird client
      ansible.builtin.apt:
        name: netbird
        state: present
        update_cache: true

    - name: set up ip forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-ip-forward.conf
        content: "net.ipv4.ip_forward = 1\n"
        mode: "644"
      register: sysctl_conf

    - name: apply sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl_conf.changed
      changed_when: true

    - name: check netbird peer status
      ansible.builtin.command: netbird status
      register: netbird_peer_status
      changed_when: false
      failed_when: false

    - name: create temp setup key for enrollment
      community.ansible_netbird.netbird_setup_key:
        name: "{{ ansible_date_time.epoch }}-enroll-{{ inventory_hostname }}"
        key_type: one-off
        expires_in: 3600
        state: present
      register: netbird_setup_key
      delegate_to: localhost
      when: "'Management: Connected' not in netbird_peer_status.stdout"
        
    - name: enroll netbird peer
      ansible.builtin.command: netbird up
      environment:
        NB_MANAGEMENT_URL: "https://{{ netbird_domain }}"
        NB_SETUP_KEY: "{{ netbird_setup_key.setup_key.key }}"
      when: "'Management: Connected' not in netbird_peer_status.stdout"
      changed_when: true

    - name: get netbird peers
      community.ansible_netbird.netbird_info:
        resource: peers
      delegate_to: localhost
      register: netbird_peers
      
    - name: get netbird groups
      community.ansible_netbird.netbird_info:
        resource: groups
      delegate_to: localhost
      register: netbird_groups
      
    - ansible.builtin.debug:
        var: netbird_peers
    - ansible.builtin.debug:
        var: netbird_groups

    - name: add homelab machines to netbird network
      community.ansible_netbird.netbird_network:
        name: homelab
        description: internal homelab network
        routers:
          - peer: "{{ netbird_router_peer_id }}"
            masquerade: true
        resources: "{{ lookup('ansible.builtin.template', 'netbird-resources.yml.j2') | from_yaml | default([], true) }}"
      delegate_to: localhost
    
  handlers:
    - name: restart netbird
      community.docker.docker_compose_v2:
        project_src: /etc/netbird
        state: restarted

- name: setup reverse proxy
  hosts: rev_proxy_vm
  tasks:
    - name: add caddy repository
      ansible.builtin.deb822_repository:
        name: caddy
        types: deb
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    
    - name: install packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - caddy
        state: present
        update_cache: true
    
    - name: enable qemu guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: write caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "644"
        validate: caddy validate --adapter caddyfile --config %s
      notify: reload caddy
    
    - name: enable caddy
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started
  
  handlers:
    - name: reload caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
