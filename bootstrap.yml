- name: proxmox bootstrap
  hosts: gateway_node
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ wan_ip }}"
      api_user: root@pam
      api_password: "{{ proxmox_password }}"
      # validate_certs: true
      ca_path: "{{ proxmox_ca_path }}"
  vars:
    ansible_host: "{{ wan_ip }}"
    interfaces:
      - name: eth0
        mac: "{{ wan_mac }}"
      - name: eth1
        mac: "{{ lan_mac }}"
    proxmox_ca_path: "/tmp/proxmox-ca-{{ inventory_hostname }}.pem"

    # proxmox vm stuff
    proxmox_iso_storage_path: /var/lib/vz/template/iso
    opnsense_mirror: "https://pkg.opnsense.org/releases/26.7"
    opnsense_iso: OPNsense-26.7-dvd-amd64.iso
    opnsense_sha256: 95cafedda6d5b22ce832e249dc2309110fbee19f813ad78cf28bb3d387186bfb
  tasks:
    # - name: ping hosts
    #   ansible.builtin.ping:
    # - ansible.builtin.debug:
    #     var: ansible_facts

    - name: write new nic link files
      ansible.builtin.template:
        src: systemd-nic.link.j2
        dest: "/etc/systemd/network/10-net-{{ item.name }}.link"
      loop: "{{ interfaces }}"
      register: interface_update

    - name: copy new interfaces configuration
      ansible.builtin.template:
        src: interfaces.j2
        dest: /etc/network/interfaces
      vars:
        gateway: wan
      register: interface_update

    - name: restart to pick up new network config
      ansible.builtin.reboot:
      when: interface_update.changed

    - name: get proxmox ca
      ansible.builtin.slurp:
        src: /etc/pve/pve-root-ca.pem
      register: proxmox_ca

    - name: write ca to temp file
      ansible.builtin.copy:
        content: "{{ proxmox_ca.content | b64decode }}"
        dest: "{{ proxmox_ca_path }}"
        mode: "0600"
      delegate_to: localhost

    # OPNSENSE VM INSTALL

    - name: check for opnsense iso
      ansible.builtin.stat:
        path: "{{ proxmox_iso_storage_path }}//{{ opnsense_iso }}"
        get_checksum: false
      register: opnsense_iso_stat
      # changed_when: not opnsense_iso_stat.stat.exists

    - name: download opnsense image
      ansible.builtin.get_url:
        url: "{{ opnsense_mirror }}/{{ opnsense_iso }}.bz2"
        dest: "{{ proxmox_iso_storage_path }}/{{ opnsense_iso }}.bz2"
        checksum: "sha256:{{ opnsense_sha256 }}"
        mode: "644"
      when: not opnsense_iso_stat.stat.exists

    - name: decompress opnsense image
      community.general.decompress:
        src: "{{ proxmox_iso_storage_path }}/{{ opnsense_iso }}.bz2"
        dest: "{{ proxmox_iso_storage_path }}/{{ opnsense_iso }}"
        format: bz2
        remove: true
      when: not opnsense_iso_stat.stat.exists

    - name: create gateway vm
      community.proxmox.proxmox_kvm:
        name: gateway
        node: "{{ inventory_hostname }}"
        vmid: "{{ hostvars.gateway_vm.vm_id }}"
        bios: seabios
        onboot: true
        cpu: host
        cores: 2
        memory: 6144 # this can be decreased to 4096 after install
        # balloon: 4096
        scsihw: virtio-scsi-single
        boot: "order=scsi0;ide2"
        ide:
          ide2: "local:iso/{{ opnsense_iso }},media=cdrom"
        net:
          net0: 'virtio,bridge=vmbr0,firewall=0'
          net1: 'virtio,bridge=vmbr1,firewall=0'
      delegate_to: localhost

    - name: create gateway disk
      community.proxmox.proxmox_disk:
        disk: scsi0
        vmid: "{{ hostvars.gateway_vm.vm_id }}"
        storage: local-lvm
        size: "{{ hostvars.gateway_vm.vm_storage }}"
      delegate_to: localhost

    - name: start gateway vm
      community.proxmox.proxmox_kvm:
        name: gateway
        node: "{{ inventory_hostname }}"
        state: started
      delegate_to: localhost

  handlers:
    - name: reboot
      ansible.builtin.reboot:

