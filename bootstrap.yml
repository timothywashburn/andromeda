- name: configure gateway host for bootstrapping
  hosts: gateway_node
  gather_facts: false
  tasks:
    - name: set gateway host to non internal ip
      ansible.builtin.set_fact:
        ansible_host: "{{ wan_ip }}"

- name: configure internal nodes for bootstrapping
  hosts: generic_deb_vms:storage
  gather_facts: false
  tasks:
    - ansible.builtin.set_fact:
        ansible_ssh_common_args: >-
          -J root@{{ hostvars[groups.gateway_node | first].ansible_host }}
          -o StrictHostKeyChecking=accept-new

- name: gateway host prep
  hosts: gateway_node
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 01_proxmox_host.yml

- name: proxmox bootstrap
  hosts: gateway_node
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_module_defaults }}" 
  vars:
    # proxmox vm stuff
    proxmox_iso_storage_path: /var/lib/vz/template/iso
    opnsense_mirror: "https://pkg.opnsense.org/releases/26.7"
    opnsense_iso: OPNsense-26.7-dvd-amd64.iso
    opnsense_sha256: 95cafedda6d5b22ce832e249dc2309110fbee19f813ad78cf28bb3d387186bfb
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: fetch_ca.yml

    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 02_proxmox_gateway_vm.yml

# - name: truenas bootstrap
#   hosts: storage
#   tasks:
#     - ansible.builtin.import_role:
#         name: bootstrap
#         tasks_from: 03_truenas_setup.yml

- name: change relay ssh port
  hosts: public_relay
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 04_ssh_public_relay.yml

- name: gateway vm wireguard instance intial setup
  hosts: gateway_vm
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}" 
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 05_gateway_vm_wireguard_pt1.yml
  
- name: public relay wireguard setup
  hosts: public_relay
  vars:
    peer: "{{ hostvars[groups.gateway_vm | first] }}"
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 06_public_relay_wireguard.yml

- name: gateway vm wireguard instance final setup
  hosts: gateway_vm
  vars:
    ansible_host: "{{ hostvars[groups.gateway_node | first].wan_ip }}"
    peer: "{{ hostvars[groups.public_relay | first] }}"
    api_delegate: "{{ groups.gateway_node | first }}"
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}"
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 07_gateway_vm_wireguard_pt2.yml

- name: configure opnsense after wireguard tunnel install
  hosts: gateway_vm
  vars:
    ansible_host: "{{ hostvars[groups.gateway_node | first].wan_ip }}"
    peer: "{{ hostvars[groups.public_relay | first] }}"
    api_delegate: "{{ groups.gateway_node | first }}"
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}"
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 08_configure_opnsense.yml

- name: forward public relay traffic
  hosts: public_relay
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 09_forward_relay_traffic.yml

- name: switch proxmox gateway
  hosts: gateway_node
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: configure_interfaces.yml
      vars:
        gateway: lan

    - name: register gateway switch to vm
      ansible.builtin.copy:
        content: ""
        dest: /andromeda/markers/lan-gateway
        mode: "644"

- name: prepare debian cloud image
  hosts: gateway_node
  tasks:
    - name: download debian cloud image
      ansible.builtin.get_url:
        url: "{{ debian_cloud_image.base_url }}/{{ debian_cloud_image.file }}"
        dest: "/var/lib/vz/import/{{ debian_cloud_image.file }}"
        checksum: "sha512:{{ debian_cloud_image.base_url }}/SHA512SUMS"
        mode: "644"

- name: provision debian cloud vms
  hosts: generic_deb_vms
  gather_facts: false
  vars:
    proxmox_node: "{{ groups.gateway_node | first }}"
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_module_defaults }}"
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: fetch_ca.yml
    
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 10_provision_debian_vms.yml

- name: setup netbird management and client
  hosts: netbird_vm
  module_defaults:
    group/community.ansible_netbird.netbird:
      api_url: "https://{{ netbird_domain }}"
      api_token: "{{ netbird_pat }}"
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 20_netbird_vm.yml

- name: setup reverse proxy
  hosts: rev_proxy_vm
  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: 21_caddy_rev_proxy.yml
