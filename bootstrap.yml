- name: gateway host prep
  hosts: gateway_node
  vars:
    ansible_host: "{{ wan_ip }}"
    interfaces:
      - name: wan0
        mac: "{{ wan_mac }}"
      - name: lan0
        mac: "{{ lan_mac }}"
  tasks:
    - ansible.builtin.import_role:
        name: 01_proxmox_host


- name: proxmox bootstrap
  hosts: gateway_node
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_module_defaults }}" 
  vars:
    ansible_host: "{{ wan_ip }}"

    # proxmox vm stuff
    proxmox_iso_storage_path: /var/lib/vz/template/iso
    opnsense_mirror: "https://pkg.opnsense.org/releases/26.7"
    opnsense_iso: OPNsense-26.7-dvd-amd64.iso
    opnsense_sha256: 95cafedda6d5b22ce832e249dc2309110fbee19f813ad78cf28bb3d387186bfb
  tasks:
    - ansible.builtin.import_tasks: tasks/proxmox/fetch_ca.yml
    
    # - name: get proxmox ca
    #   ansible.builtin.slurp:
    #     src: /etc/pve/pve-root-ca.pem
    #   register: proxmox_ca

    # - name: write ca to temp file
    #   ansible.builtin.copy:
    #     content: "{{ proxmox_ca.content | b64decode }}"
    #     dest: "{{ proxmox_ca_path }}"
    #     mode: "600"
    #   delegate_to: localhost

    - ansible.builtin.import_role:
        name: 02_proxmox_gateway_vm

