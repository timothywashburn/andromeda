ansible_user: root
ansible_python_interpreter: /usr/bin/python3

public_ssh_keys:
  - ssh-rsa  timothy@Timothys-MacBook-Pro.local

debian_cloud_image:
  base_url: https://cloud.debian.org/images/cloud/trixie/20260819-2575
  file: debian-13-genericcloud-amd64-20260819-2575.qcow2

rocky_cloud_image:
  base_url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64
  file: Rocky-9-GenericCloud-Base-9.8-20260525.0.x86_64.qcow2

static_rules:
  - name: allow v4 lan traffic
    interface: [lan]
    source_net: lan
    ip_protocol: inet

homelab_networks:
  - name: main
    cidr: 10.127.0.0/24

# names must be alphanumberic + underscores
services:
  # - name: https_test2
  #   protocol: tcp
  #   ports: "1,70,8000-8010"
  #   dest: 10.127.0.50
  # - name: asdf
  #   protocol: tcp
  #   ports: "80"
  #   dest: 10.127.0.50
  #   dest_port: 8080
  - name: reverse_proxy
    protocol: tcp
    ports: "80,443"
    dest: "{{ hostvars[groups.rev_proxy_vm | first].ansible_host }}"

proxy_routes:
  - host: "{{ netbird_domain }}"
    backend: "{{ hostvars[groups.netbird_vm | first].ansible_host }}:{{ hostvars[groups.netbird_vm | first].netbird_dashboard_port }}"
    grpc_backend: "{{ hostvars[groups.netbird_vm | first].ansible_host }}:{{ hostvars[groups.netbird_vm | first].netbird_server_port }}"
  - host: "ai.***REMOVED***"
    backend: "10.127.0.100:8080"
