apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.1
    helm:
      valuesObject:
        configs:
          cm:
            timeout.reconciliation: 30s
            timeout.reconciliation.jitter: 5s
          params:
            server.insecure: true
        server:
          service:
            type: LoadBalancer
            servicePortHttp: 8080
            servicePortHttps: 8081
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
