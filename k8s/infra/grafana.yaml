apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.4.0
    helm:
      valuesObject:
        deploymentStrategy:
          type: Recreate
        service:
          type: LoadBalancer
          port: 3000
        persistence:
          enabled: true
          storageClassName: truenas-iscsi-unprotected
        admin:
          existingSecret: grafana-admin
        datasources:
          datasources.yml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-server:9090
              isDefault: true
        
        # TODO: unsure if this is temporary (because of dashboard below)
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                options:
                  path: /var/lib/grafana/dashboards/default
            
        # TODO: temporary dashboard
        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 45
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: true
