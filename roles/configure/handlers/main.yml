# relay-iptables
- name: reload iptables
  ansible.builtin.command: iptables-restore /etc/iptables/rules.v4
  changed_when: true

# opnsense
- name: opnsense api handlers
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}"
  delegate_to: "{{ opnsense_api_delegate }}"
  block:
    - name: apply firewall aliases
      oxlorg.opnsense.raw:
        module: firewall
        controller: alias
        command: reconfigure
        action: post

    - name: apply firewall rules
      oxlorg.opnsense.raw:
        module: firewall
        controller: filter
        command: apply
        action: post

# caddy-config
- name: reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
