- name: download k3s installer
  ansible.builtin.get_url:
    url: "https://get.k3s.io"
    dest: /usr/local/bin/k3s-install.sh
    mode: "755"

- name: create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "755"

- name: add k3s config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "600"
  notify: restart k3s

- name: install k3s server
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  ansible.builtin.command: /usr/local/bin/k3s-install.sh

- name: configure k3s to trust proxy traffic
  ansible.builtin.template:
    src: traefik-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: "600"

# truenas api key + helm csi driver

- name: install dependencies 
  ansible.builtin.apt:
    name: 
      - curl
      - python3-kubernetes # python kubernetes bridge for ansible
      - nfs-common
      - open-iscsi
    state: present
    update_cache: true

- name: download helm installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
    dest: /usr/local/bin/get-helm.sh
    mode: "755"

- name: install helm
  args:
    creates: /usr/local/bin/helm
  ansible.builtin.command: /usr/local/bin/get-helm.sh

- environment:
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  block:
    - name: create truenas csi namespace
      kubernetes.core.k8s:
        name: truenas-csi
        kind: Namespace
        state: present
    
    - name: check k3s for truenas api key
      kubernetes.core.k8s_info:
        name: "{{ truenas_csi_secret }}"
        kind: Secret
        namespace: truenas-csi
      register: api_key_secret

    # if there is no k3s secret, then we must check to see if there's already are API key(s) with the same name
    - name: look for previous orphaned truenas api keys
      vars:
        payload:
          - [name, "=", "{{ truenas_api_key_name }}"]
      ansible.builtin.command:
        argv: [midclt, call, api_key.query, "{{ payload | to_json }}"]
      delegate_to: "{{ groups.storage | first }}"
      register: orphaned_api_keys
      when: api_key_secret.resources | length == 0
      changed_when: false

    # if there are API key(s), we need to delete and replace it because there's no way to read them again
    - name: delete orphaned truenas api keys
      ansible.builtin.command:
        argv: [midclt, call, api_key.delete, "{{ item.id | string }}"]
      delegate_to: "{{ groups.storage | first }}"
      loop: "{{ orphaned_api_keys.stdout | default('[]') | from_json }}"
      changed_when: true

    - name: create truenas api key
      vars:
        payload:
          name: "{{ truenas_api_key_name }}"
          username: "{{ hostvars[groups.storage | first].ansible_user }}"
      ansible.builtin.command:
        argv: [midclt, call, api_key.create, "{{ payload | to_json }}"]
      delegate_to: "{{ groups.storage | first }}"
      register: new_api_key
      when: api_key_secret.resources | length == 0
      changed_when: true

    - name: create k3s secret with truenas api key
      kubernetes.core.k8s:
        state: present
        definition:
          kind: Secret
          metadata:
            name: "{{ truenas_csi_secret }}"
            namespace: truenas-csi
          stringData:
            api-key: "{{ (new_api_key.stdout | from_json).key }}"
      when: api_key_secret.resources | length == 0

    - name: add truenas csi helm repo
      kubernetes.core.helm_repository:
        name: truenas-csi
        repo_url: https://raw.githubusercontent.com/truenas/truenas-csi/master/charts

    - name: install truenas-csi helm chart
      kubernetes.core.helm:
        name: truenas-csi
        chart_ref: truenas-csi/truenas-csi
        chart_version: 1.3.0
        release_namespace: truenas-csi
        values:
          truenas:
            url: "wss://{{ hostvars[groups.storage | first].ansible_host }}"
            defaultPool: "{{ hostvars[groups.storage | first].storage_pool.name }}"
            insecureSkipTLS: true
            existingSecret: "{{ truenas_csi_secret }}"
          storageClasses:
            - name: truenas-nfs
              isDefault: true
              reclaimPolicy: Delete
              volumeBindingMode: Immediate
              parameters:
                protocol: nfs
                datasetPath: "{{ k3s_persistent_data.dataset_suffix }}/nfs"
                compression: LZ4
            - name: truenas-nfs-unprotected
              reclaimPolicy: Delete
              volumeBindingMode: Immediate
              parameters:
                protocol: nfs
                datasetPath: "{{ k3s_unprotected_data.dataset_suffix }}/nfs"
                compression: LZ4
            - name: truenas-iscsi
              reclaimPolicy: Delete
              volumeBindingMode: Immediate
              mountOptions:
                - discard
              parameters:
                protocol: iscsi
                datasetPath: "{{ k3s_persistent_data.dataset_suffix }}/iscsi"
                compression: LZ4
                volblocksize: 16K
                sparse: true
            - name: truenas-iscsi-unprotected
              reclaimPolicy: Delete
              volumeBindingMode: Immediate
              mountOptions:
                - discard
              parameters:
                protocol: iscsi
                datasetPath: "{{ k3s_unprotected_data.dataset_suffix }}/iscsi"
                compression: LZ4
                volblocksize: 16K
                sparse: true
    
    - name: add argo helm repo
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm

    - name: check if argo is already running
      kubernetes.core.k8s_info:
        name: argocd-server
        kind: Deployment
        namespace: argocd
      register: argo_running

    - name: check if argo base application exists
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        name: base
        kind: Application
        namespace: argocd
      register: argo_base

    - name: get all manifest templates
      ansible.builtin.find:
        paths: "{{ role_path }}/templates/manifests"
        recurse: true
        file_type: file
      delegate_to: localhost
      register: manifest_templates

    - name: apply manifests
      kubernetes.core.k8s:
        state: present
        template: "{{ item.path }}"
      loop: "{{ manifest_templates.files | sort(attribute='path') }}"
      loop_control:
        label: "{{ item.path | relpath(playbook_dir) }}"

    - name: "bootstrap argo: initial install"
      vars:
        argocd_manifest: "{{ lookup('file', playbook_dir ~ '/k8s/infra/argocd.yaml') | from_yaml }}"
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        chart_version: "{{ argocd_manifest.spec.source.targetRevision }}"
        release_namespace: argocd
        create_namespace: true
        values: "{{ argocd_manifest.spec.source.helm.valuesObject }}"
        wait: true
      when: argo_running.resources | length == 0

    - name: "bootstrap argo: configuration"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir ~ '/k8s/base.yaml') | from_yaml }}"
      when: argo_base.resources | length == 0

- name: set up k3s volume map script
  ansible.builtin.import_tasks: k3s_volume_map.yml
