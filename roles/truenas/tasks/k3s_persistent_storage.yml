- name: get k3s persistent datasets
  vars:
    payload:
      - [name, "^", "{{ k3s_persistent_data.dataset }}"]
  ansible.builtin.command:
    argv: [midclt, call, pool.dataset.query, "{{ payload | to_json }}"]
  register: k3s_dataset
  changed_when: false

- name: create parent dataset
  vars:
    payload:
      name: "{{ k3s_persistent_data.dataset }}"
      type: FILESYSTEM
      create_ancestors: true
  ansible.builtin.command:
    argv: [midclt, call, pool.dataset.create, "{{ payload | to_json }}"]
  when: (k3s_dataset.stdout | from_json) | length == 0
  changed_when: true

- name: get state of nfs service
  vars:
    payload:
      - [service, "=", nfs]
  ansible.builtin.command:
    argv: [midclt, call, service.query, "{{ payload | to_json }}"]
  register: nfs_service
  changed_when: false

- name: enable nfs service
  vars:
    payload:
      enable: true
  ansible.builtin.command:
    argv: [midclt, call, service.update, nfs, "{{ payload | to_json }}"]
  when: not (nfs_service.stdout | from_json)[0].enable
  changed_when: true

- name: start nfs service
  ansible.builtin.command:
    argv: [midclt, call, service.start, nfs]
  when: (nfs_service.stdout | from_json)[0].state != "RUNNING"
  changed_when: true

- name: get k3s metadata dataset
  vars:
    payload:
      - [name, "^", "{{ k3s_metadata.dataset }}"]
  ansible.builtin.command:
    argv: [midclt, call, pool.dataset.query, "{{ payload | to_json }}"]
  register: k3s_metadata_dataset_query
  changed_when: false

- name: create k3s metadata dataset
  vars:
    payload:
      name: "{{ k3s_metadata.dataset }}"
      type: FILESYSTEM
      create_ancestors: true
  ansible.builtin.command:
    argv: [midclt, call, pool.dataset.create, "{{ payload | to_json }}"]
  when: (k3s_metadata_dataset_query.stdout | from_json) | length == 0
  changed_when: true

- name: check if k3s volume metadata is shared with control plane
  vars:
    payload:
      - [path, "=", "/mnt/{{ k3s_metadata.dataset }}"]
  ansible.builtin.command:
    argv: [midclt, call, sharing.nfs.query, "{{ payload | to_json }}"]
  register: k3s_shared_metadata
  changed_when: false

- ansible.builtin.debug:
    msg: "{{ (k3s_shared_metadata.stdout | from_json) | length == 0 }}"

- name: share k3s volume metadata with control plane
  vars:
    payload:
      path: "/mnt/{{ k3s_metadata.dataset }}"
      hosts:
        - "{{ hostvars[groups.k3s_control_plane | first].ansible_host }}"
      maproot_user: root
      maproot_group: root
  ansible.builtin.command:
    argv: [midclt, call, sharing.nfs.create, "{{ payload | to_json }}"]
  when: (k3s_shared_metadata.stdout | from_json) | length == 0
  changed_when: true
