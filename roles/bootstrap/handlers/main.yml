# from 01_proxmox_host
- name: update initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: reboot
  ansible.builtin.reboot:

- name: update interfaces
  ansible.builtin.command: ifreload -a
  changed_when: true

- name: update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: restart pveproxy
  ansible.builtin.systemd_service:
    name: pveproxy
    state: restarted

# from 05_gateway_vm_wireguard_pt1
- name: reload wireguard (pt1)
  delegate_to: "{{ groups.gateway_node | first }}"
  oxlorg.opnsense.reload:
    target: wireguard

# from 06_public_relay_wireguard
- name: restart wireguard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: restarted

# from 07_gateway_vm_wireguard_pt2
- name: reload wireguard (pt2)
  delegate_to: "{{ api_delegate }}"
  oxlorg.opnsense.reload:
    target: wireguard

# from 08_configure_opnsense
- name: apply firewall aliases
  oxlorg.opnsense.raw:
    module: firewall
    controller: alias
    command: reconfigure
    action: post

- name: apply firewall rules
  oxlorg.opnsense.raw:
    module: firewall
    controller: filter
    command: apply
    action: post

- name: apply unbound
  oxlorg.opnsense.raw:
    module: unbound
    controller: service
    command: reconfigure
    action: post

# from 09_forward_relay_traffic
- name: reload iptables
  ansible.builtin.command: iptables-restore /etc/iptables/rules.v4
  changed_when: true

# from 20_netbird_vm
- name: restart netbird # noqa: syntax-check[unknown-module]
  community.docker.docker_compose_v2:
    project_src: /etc/netbird
    state: restarted

# from 21_caddy_rev_proxy
- name: reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
