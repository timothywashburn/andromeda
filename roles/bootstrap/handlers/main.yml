- name: update initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: reboot
  ansible.builtin.reboot:

- name: update interfaces
  ansible.builtin.command: ifreload -a
  changed_when: true

- name: update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: reload iptables
  ansible.builtin.command: iptables-restore /etc/iptables/rules.v4
  changed_when: true

- name: restart pveproxy
  ansible.builtin.systemd_service:
    name: pveproxy
    state: restarted

# wireguard
- name: restart wireguard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: restarted

# opnsense
- name: opnsense api handlers
  module_defaults:
    group/oxlorg.opnsense.all: "{{ opnsense_module_defaults }}"
  delegate_to: "{{ opnsense_api_delegate }}"
  block:
    - name: reload wireguard
      oxlorg.opnsense.reload:
        target: wireguard

    - name: apply firewall aliases
      oxlorg.opnsense.raw:
        module: firewall
        controller: alias
        command: reconfigure
        action: post

    - name: apply firewall rules
      oxlorg.opnsense.raw:
        module: firewall
        controller: filter
        command: apply
        action: post

# netbird
- name: restart netbird # noqa: syntax-check[unknown-module]
  community.docker.docker_compose_v2:
    project_src: /etc/netbird
    state: restarted

# caddy
- name: reload caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
