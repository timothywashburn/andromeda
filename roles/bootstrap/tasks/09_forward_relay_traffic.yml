- name: set up ip forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-ip-forwarding.conf
    content: "net.ipv4.ip_forward = 1\n"
    mode: "644"
  register: sysctl_conf

- name: apply sysctl
  ansible.builtin.command: sysctl --system
  when: sysctl_conf.changed
  changed_when: true

- name: install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true

- name: setup iptable rules
  ansible.builtin.import_role:
    name: configure
    tasks_from: relay-iptables.yml
