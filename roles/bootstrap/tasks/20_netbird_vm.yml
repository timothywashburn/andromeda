- module_defaults:
    group/community.ansible_netbird.netbird:
      api_url: "https://{{ netbird_domain }}"
      api_token: "{{ netbird_pat }}"
  block:
    - name: install docker
      ansible.builtin.import_tasks: install_docker.yml

    - name: install packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
        state: present
        update_cache: true
        
    - name: enable qemu guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: create netbird directory
      ansible.builtin.file:
        path: /etc/netbird
        state: directory
        mode: "755"

    - name: write netbird compose file
      ansible.builtin.template:
        src: netbird-compose.yml.j2
        dest: /etc/netbird/docker-compose.yml
        mode: "600"
      notify: restart netbird

    - name: write netbird server config
      ansible.builtin.template:
        src: netbird-config.yaml.j2
        dest: /etc/netbird/config.yaml
        mode: "600"
      diff: false
      notify: restart netbird

    - name: write netbird dashboard env
      ansible.builtin.template:
        src: netbird-dashboard.env.j2
        dest: /etc/netbird/dashboard.env
        mode: "600"
      notify: restart netbird

    - name: start netbird
      community.docker.docker_compose_v2:
        project_src: /etc/netbird
        state: present
        wait: true
        wait_timeout: 30

    - name: flush handlers
      ansible.builtin.meta: flush_handlers

    - name: wait for netbird server
      ansible.builtin.uri:
        url: "https://{{ netbird_domain }}/oauth2/.well-known/openid-configuration"
        method: GET
        status_code: [200, 502, 503]
      register: netbird_ready
      until: netbird_ready.status == 200
      retries: 10
      delay: 2

    - name: create netbird admin account
      ansible.builtin.uri:
        url: "https://{{ netbird_domain }}/api/setup"
        method: POST
        body_format: json
        body:
          email: "{{ netbird_admin_email }}"
          name: "{{ netbird_admin_name }}"
          password: "{{ netbird_admin_password }}"
          create_pat: true
          pat_expire_in: 365
      register: netbird_admin_account
      when: netbird_pat is not defined
      no_log: true

    - name: save netbird personal access token
      ansible.builtin.copy:
        content: |
          # written by Ansible ({{ '%Y-%m-%d' | strftime }})
          netbird_pat: "{{ netbird_admin_account.json.personal_access_token }}"
        dest: "{{ inventory_dir }}/group_vars/all/netbird_pat.yml"
        mode: "600"
      delegate_to: localhost
      when: netbird_admin_account is not skipped
      no_log: true
      diff: false

    - name: load netbird personal access token
      ansible.builtin.set_fact:
        netbird_pat: "{{ netbird_admin_account.json.personal_access_token }}"
      no_log: true
      when: netbird_admin_account is not skipped

    - name: increase netbird peer session expiration 
      community.ansible_netbird.netbird_account:
        peer_login_expiration_enabled: true
        peer_login_expiration: "{{ 30 * 24 * 60 * 60 }}"
      delegate_to: localhost

    # client setup

    - name: add netbird repository
      ansible.builtin.deb822_repository:
        name: netbird
        types: deb
        uris: https://pkgs.netbird.io/debian
        suites: stable
        components: main
        signed_by: https://pkgs.netbird.io/debian/public.key
      
    - name: install netbird client
      ansible.builtin.apt:
        name: netbird
        state: present
        update_cache: true

    - name: set up ip forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-ip-forward.conf
        content: "net.ipv4.ip_forward = 1\n"
        mode: "644"
      register: sysctl_conf

    - name: apply sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl_conf.changed
      changed_when: true

    - name: check netbird peer status
      ansible.builtin.command: netbird status
      register: netbird_peer_status
      changed_when: false
      failed_when: false

    - name: create temp setup key for enrollment
      community.ansible_netbird.netbird_setup_key:
        name: "{{ ansible_date_time.epoch }}-enroll-{{ inventory_hostname }}"
        key_type: one-off
        expires_in: 3600
        state: present
      register: netbird_setup_key
      delegate_to: localhost
      when: "'Management: Connected' not in netbird_peer_status.stdout"
        
    - name: enroll netbird peer
      ansible.builtin.command: netbird up
      environment:
        NB_MANAGEMENT_URL: "https://{{ netbird_domain }}"
        NB_SETUP_KEY: "{{ netbird_setup_key.setup_key.key }}"
      when: "'Management: Connected' not in netbird_peer_status.stdout"
      changed_when: true

    - name: get netbird peers
      community.ansible_netbird.netbird_info:
        resource: peers
      delegate_to: localhost
      register: netbird_peers
      
    - name: get netbird groups
      community.ansible_netbird.netbird_info:
        resource: groups
      delegate_to: localhost
      register: netbird_groups

    - name: extract netbird all group id
      ansible.builtin.set_fact:
        netbird_all_group_id: "{{ (netbird_groups.data | selectattr('name', 'eq', 'All') | first).id }}"
      
    - name: add homelab machines to netbird network
      vars:
        netbird_router_peer_id: "{{ (netbird_peers.data | selectattr('hostname', 'eq', inventory_hostname | replace('_', '-')) | first).id }}"
      community.ansible_netbird.netbird_network:
        name: homelab
        description: internal homelab network
        routers:
          - peer: "{{ netbird_router_peer_id }}"
            masquerade: true
        resources: "{{ lookup('ansible.builtin.template', 'netbird-resources.yml.j2') | from_yaml | default([], true) }}"
      delegate_to: localhost

    - name: use dns server for homelab dns lookups on connected peers
      community.ansible_netbird.netbird_dns:
        name: homelab-dns
        description: use dns server for homelab dns lookups on connected peers
        nameservers:
          - ip: "{{ dns_server }}"
            ns_type: udp
            port: 53
        groups:
          - "{{ netbird_all_group_id }}"
        domains:
          - "{{ public_domain }}"
        search_domains_enabled: false
      delegate_to: localhost

    - name: create adblocking group
      community.ansible_netbird.netbird_group:
        name: adblock
      register: netbird_adblock_group
      delegate_to: localhost
    
    - name: use pihole dns for adblock group
      community.ansible_netbird.netbird_dns:
        name: adblock-dns
        description: uses pihole dns for adblocking (for external devices)
        nameservers:
          - ip: "{{ dns_server }}"
            ns_type: udp
            port: 53
        groups:
          - "{{ netbird_adblock_group.group.id }}"
        primary: true
        search_domains_enabled: false
      delegate_to: localhost
