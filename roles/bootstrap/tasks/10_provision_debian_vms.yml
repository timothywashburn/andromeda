- name: create vm
  community.proxmox.proxmox_kvm:
    name: "{{ inventory_hostname | replace('_', '-') }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ vm_id }}"
    bios: seabios
    onboot: true
    cpu: host
    cores: "{{ vm_cores }}"
    memory: "{{ vm_memory_mb }}"
    scsihw: virtio-scsi-single
    boot: "order=scsi0"
    agent: true
    citype: nocloud
    ciuser: root
    cipassword: "{{ temp_password }}" # TODO: temp
    sshkeys: "{{ public_ssh_keys | join('\n') }}"
    nameservers: "10.127.0.254"
    ipconfig:
      ipconfig0: "ip={{ ansible_host }}/24,gw=10.127.0.254"
    ide:
      ide2: "local-lvm:cloudinit"
    net:
      net0: "virtio,bridge=vmbr1,firewall=0"
    serial:
      serial0: socket
  delegate_to: localhost

- name: import cloud image as boot disk
  community.proxmox.proxmox_disk:
    vmid: "{{ vm_id }}"
    disk: scsi0
    storage: local-lvm
    import_from: "local:import/{{ debian_cloud_image.file }}"
  delegate_to: localhost
  register: disk_import

- name: grow cloud image boot disk
  community.proxmox.proxmox_disk:
    vmid: "{{ vm_id }}"
    disk: scsi0
    state: resized
    size: "{{ vm_storage_gb }}G"
  delegate_to: localhost
  when: disk_import.changed

- name: start vm
  community.proxmox.proxmox_kvm:
    vmid: "{{ vm_id }}"
    node: "{{ proxmox_node }}"
    state: started
  delegate_to: localhost

- name: wait for ssh
  ansible.builtin.wait_for_connection:
    timeout: 60
