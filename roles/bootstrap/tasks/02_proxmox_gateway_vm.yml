- vars:
    proxmox_iso_storage_path: /var/lib/vz/template/iso
    opnsense_mirror: "https://pkg.opnsense.org/releases/26.7"
    opnsense_iso: OPNsense-26.7-dvd-amd64.iso
    opnsense_sha256: 95cafedda6d5b22ce832e249dc2309110fbee19f813ad78cf28bb3d387186bfb
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_module_defaults }}" 
  block:
    - ansible.builtin.import_role:
        name: bootstrap
        tasks_from: fetch_proxmox_ca.yml

    - name: create certificate directory
      ansible.builtin.file:
        path: /etc/ssl/andromeda
        state: directory
        mode: "700"
      
    - name: generate ssl private key
      community.crypto.openssl_privatekey:
        path: /etc/ssl/andromeda/pveproxy.key
        mode: "600"

    - name: generate proxmox csr
      community.crypto.openssl_csr:
        path: /etc/ssl/andromeda/pveproxy.csr
        privatekey_path: /etc/ssl/andromeda/pveproxy.key
        common_name: "{{ inventory_hostname }}.internal"
        subject_alt_name:
          - "DNS:{{ inventory_hostname }}"
          - "DNS:{{ inventory_hostname }}.internal"
          - "IP:127.0.0.1"
          - "IP:{{ lan_ip }}"
          - "IP:{{ wan_ip }}"

    - name: sign certificate using ca
      community.crypto.x509_certificate:
        path: /etc/ssl/andromeda/pveproxy.pem
        csr_path: /etc/ssl/andromeda/pveproxy.csr
        provider: ownca
        ownca_path: /etc/pve/pve-root-ca.pem
        ownca_privatekey_path: /etc/pve/priv/pve-root-ca.key
        mode: "640"
      register: pve_cert

    - name: read certificate
      ansible.builtin.slurp:
        src: /etc/ssl/andromeda/pveproxy.pem
      register: pve_cert_pem
      when: pve_cert is changed

    - name: read certificate key
      ansible.builtin.slurp:
        src: /etc/ssl/andromeda/pveproxy.key
      register: pve_cert_key
      when: pve_cert is changed

    - name: install certificate
      community.proxmox.proxmox_node:
        node: "{{ inventory_hostname }}"
        certificates:
          certificate: "{{ pve_cert_pem.content | b64decode }}"
          private_key: "{{ pve_cert_key.content | b64decode }}"
          state: present
          force: true
          restart: true
      delegate_to: localhost
      no_log: true
      when: pve_cert is changed

    - name: check for opnsense iso
      ansible.builtin.stat:
        path: "{{ proxmox_iso_storage_path }}//{{ opnsense_iso }}"
        get_checksum: false
      register: opnsense_iso_stat
      # changed_when: not opnsense_iso_stat.stat.exists

    - name: download opnsense image
      ansible.builtin.get_url:
        url: "{{ opnsense_mirror }}/{{ opnsense_iso }}.bz2"
        dest: "{{ proxmox_iso_storage_path }}/{{ opnsense_iso }}.bz2"
        checksum: "sha256:{{ opnsense_sha256 }}"
        mode: "644"
      when: not opnsense_iso_stat.stat.exists

    - name: decompress opnsense image
      community.general.decompress:
        src: "{{ proxmox_iso_storage_path }}/{{ opnsense_iso }}.bz2"
        dest: "{{ proxmox_iso_storage_path }}/{{ opnsense_iso }}"
        format: bz2
        remove: true
      when: not opnsense_iso_stat.stat.exists

    - name: create gateway vm
      community.proxmox.proxmox_kvm:
        name: gateway
        node: "{{ inventory_hostname | replace('_', '-') }}"
        vmid: "{{ hostvars[groups.gateway_vm | first].vm_id }}"
        bios: seabios
        onboot: true
        cpu: host
        cores: 2
        memory: "6144" # this can be decreased to 4096 after install
        # balloon: 4096
        scsihw: virtio-scsi-single
        boot: "order=scsi0;ide2"
        agent: true
        ide:
          ide2: "local:iso/{{ opnsense_iso }},media=cdrom"
        net:
          net0: 'virtio,bridge=vmbr0,firewall=0'
          net1: 'virtio,bridge=vmbr1,firewall=0'
      delegate_to: localhost

    - name: create gateway disk
      community.proxmox.proxmox_disk:
        disk: scsi0
        vmid: "{{ hostvars[groups.gateway_vm | first].vm_id }}"
        storage: local-lvm
        size: "{{ hostvars[groups.gateway_vm | first].vm_storage_gb }}"
      delegate_to: localhost

    - name: start gateway vm
      community.proxmox.proxmox_kvm:
        name: gateway
        node: "{{ inventory_hostname }}"
        state: started
      delegate_to: localhost
